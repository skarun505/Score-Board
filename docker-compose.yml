services:
  dashboard:
    build: .
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file: ./server/.env
    volumes:
      - ./data:/app/server/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
